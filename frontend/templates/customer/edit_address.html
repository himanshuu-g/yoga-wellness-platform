{% extends "base.html" %}


{% block title %}
Edit Address | Yoga & Wellness
{% endblock %}


{% block content %}

<section class="address-form-container">

    <h1>Edit Address</h1>

    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >


        <div>
            <label for="label">
                Address Label *
            </label>

            <input
                id="label"
                type="text"
                name="label"
                value="{{ address.label }}"
                maxlength="50"
                required
            >
        </div>


        <div>
            <label for="address_line_1">
                Address Line 1 *
            </label>

            <input
                id="address_line_1"
                type="text"
                name="address_line_1"
                value="{{ address.address_line_1 }}"
                maxlength="255"
                required
            >
        </div>


        <div>
            <label for="address_line_2">
                Address Line 2
            </label>

            <input
                id="address_line_2"
                type="text"
                name="address_line_2"
                value="{{ address.address_line_2 or '' }}"
                maxlength="255"
            >
        </div>


        <div>
            <label for="locality">
                Locality *
            </label>

            <input
                id="locality"
                type="text"
                name="locality"
                value="{{ address.locality }}"
                maxlength="100"
                required
            >
        </div>


        <div>
            <label for="city">
                City *
            </label>

            <input
                id="city"
                type="text"
                name="city"
                value="{{ address.city }}"
                maxlength="100"
                required
            >
        </div>


        <div>
            <label for="state">
                State *
            </label>

            <input
                id="state"
                type="text"
                name="state"
                value="{{ address.state }}"
                maxlength="100"
                required
            >
        </div>


        <div>
            <label for="postal_code">
                PIN Code *
            </label>

            <input
                id="postal_code"
                type="text"
                name="postal_code"
                value="{{ address.postal_code }}"
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                required
            >
        </div>


        <div>
            <label for="landmark">
                Landmark
            </label>

            <input
                id="landmark"
                type="text"
                name="landmark"
                value="{{ address.landmark or '' }}"
                maxlength="255"
            >
        </div>


        <button type="submit">
            Update Address
        </button>

    </form>


    <p>
        <a href="{{ url_for('customer.profile') }}">
            Cancel
        </a>
    </p>

</section>

{% endblock %}
