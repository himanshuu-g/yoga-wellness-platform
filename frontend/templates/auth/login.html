{% extends "base.html" %}


{% block title %}
Login | Yoga & Wellness
{% endblock %}


{% block content %}

<section class="auth-container">

    <h1>Login</h1>

    <form method="POST">

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >
    
        <div>
            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                name="email"
                required
            >
        </div>


        <div>
            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                name="password"
                required
            >
        </div>


        <button type="submit">
            Login
        </button>

    </form>


    <p>
        Don't have an account?

        <a href="{{ url_for('auth.register') }}">
            Register
        </a>
    </p>

</section>

{% endblock %}
