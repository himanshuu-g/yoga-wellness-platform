{% extends "base.html" %}


{% block title %}
Register | Yoga & Wellness
{% endblock %}


{% block content %}

<section class="auth-container">

    <h1>Create Account</h1>

    <p>
        Create your customer account.
    </p>


    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <div>
            <label for="name">
                Full Name
            </label>

            <input
                id="name"
                type="text"
                name="name"
                required
            >
        </div>


        <div>
            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                name="email"
                required
            >
        </div>


        <div>
            <label for="phone">
                Phone
            </label>

            <input
                id="phone"
                type="tel"
                name="phone"
            >
        </div>


        <div>
            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                name="password"
                minlength="8"
                required
            >
        </div>


        <div>
            <label for="confirm_password">
                Confirm Password
            </label>

            <input
                id="confirm_password"
                type="password"
                name="confirm_password"
                minlength="8"
                required
            >
        </div>


        <button type="submit">
            Create Account
        </button>

    </form>


    <p>
        Already have an account?

        <a href="{{ url_for('auth.login') }}">
            Login
        </a>
    </p>

</section>

{% endblock %}
