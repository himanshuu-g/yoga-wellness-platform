{% extends "base.html" %}


{% block title %}
Provider Profile | Yoga & Wellness
{% endblock %}


{% block content %}

<section class="provider-container">

    <h1>Professional Profile</h1>


    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >


        <div>

            <label>
                Name
            </label>

            <input
                type="text"
                value="{{ current_user.name }}"
                disabled
            >

        </div>


        <div>

            <label>
                Email
            </label>

            <input
                type="email"
                value="{{ current_user.email }}"
                disabled
            >

        </div>


        <div>

            <label for="qualification">
                Qualification *
            </label>

            <input
                id="qualification"
                type="text"
                name="qualification"
                maxlength="255"
                value="{{ profile.qualification or '' }}"
                placeholder="Example: Diploma in Yoga"
                required
            >

        </div>


        <div>

            <label for="specialization">
                Specialization *
            </label>

            <input
                id="specialization"
                type="text"
                name="specialization"
                maxlength="255"
                value="{{ profile.specialization or '' }}"
                placeholder="Example: Personal Yoga, Therapeutic Yoga"
                required
            >

        </div>


        <div>

            <label for="experience_years">
                Experience (Years)
            </label>

            <input
                id="experience_years"
                type="number"
                name="experience_years"
                min="0"
                max="80"
                value="{{ profile.experience_years if profile.experience_years is not none else '' }}"
            >

        </div>


        <div>

            <label for="service_city">
                Service City *
            </label>

            <input
                id="service_city"
                type="text"
                name="service_city"
                maxlength="100"
                value="{{ profile.service_city or '' }}"
                placeholder="Example: Delhi"
                required
            >

        </div>


        <div>

            <label for="bio">
                Professional Bio
            </label>

            <textarea
                id="bio"
                name="bio"
                rows="6"
                placeholder="Tell customers about your experience..."
            >{{ profile.bio or '' }}</textarea>

        </div>


        <button type="submit">
            Save Profile
        </button>

    </form>


    <p>
        <a href="{{ url_for('provider.dashboard') }}">
            Back to Dashboard
        </a>
    </p>

</section>

{% endblock %}
