{% extends "base.html" %}


{% block title %}
Add Category | Admin
{% endblock %}


{% block content %}

<section class="admin-container">

    <h1>Add Service Category</h1>


    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >


        <div>

            <label for="name">
                Category Name *
            </label>

            <input
                id="name"
                type="text"
                name="name"
                maxlength="100"
                required
            >

        </div>


        <div>

            <label for="slug">
                Slug *
            </label>

            <input
                id="slug"
                type="text"
                name="slug"
                placeholder="example: yoga-therapy"
                maxlength="120"
                required
            >

        </div>


        <div>

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
                rows="5"
            ></textarea>

        </div>


        <div>

            <label for="display_order">
                Display Order
            </label>

            <input
                id="display_order"
                type="number"
                name="display_order"
                value="0"
                min="0"
            >

        </div>


        <button type="submit">
            Create Category
        </button>

    </form>


    <p>
        <a href="{{ url_for('admin.categories') }}">
            Cancel
        </a>
    </p>

</section>

{% endblock %}
