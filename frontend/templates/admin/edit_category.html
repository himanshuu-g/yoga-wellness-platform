{% extends "base.html" %}


{% block title %}
Edit Category | Admin
{% endblock %}


{% block content %}

<section class="admin-container">

    <h1>Edit Category</h1>


    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >


        <div>

            <label for="name">
                Category Name *
            </label>

            <input
                id="name"
                type="text"
                name="name"
                value="{{ category.name }}"
                maxlength="100"
                required
            >

        </div>


        <div>

            <label for="slug">
                Slug *
            </label>

            <input
                id="slug"
                type="text"
                name="slug"
                value="{{ category.slug }}"
                maxlength="120"
                required
            >

        </div>


        <div>

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
                rows="5"
            >{{ category.description or '' }}</textarea>

        </div>


        <div>

            <label for="display_order">
                Display Order
            </label>

            <input
                id="display_order"
                type="number"
                name="display_order"
                value="{{ category.display_order }}"
                min="0"
            >

        </div>


        <button type="submit">
            Save Changes
        </button>

    </form>


    <p>
        <a href="{{ url_for('admin.categories') }}">
            Cancel
        </a>
    </p>

</section>

{% endblock %}
