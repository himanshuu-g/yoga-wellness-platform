{% extends "base.html" %}

{% block title %}
Add Service | Admin
{% endblock %}

{% block content %}

<section class="admin-container">

    <h1>Add Service</h1>

    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <div>
            <label for="category_id">Category *</label>
            <select id="category_id" name="category_id" required>
                <option value="">Choose Category</option>
                {% for category in categories %}
                    <option value="{{ category.id }}">
                        {{ category.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="name">Service Name *</label>
            <input
                id="name"
                name="name"
                type="text"
                maxlength="150"
                required
            >
        </div>

        <div>
            <label for="slug">Slug *</label>
            <input
                id="slug"
                name="slug"
                type="text"
                maxlength="170"
                placeholder="example-service-name"
                required
            >
        </div>

        <div>
            <label for="short_description">Short Description</label>
            <input
                id="short_description"
                name="short_description"
                type="text"
                maxlength="300"
            >
        </div>

        <div>
            <label for="description">Full Description</label>
            <textarea
                id="description"
                name="description"
                rows="6"
            ></textarea>
        </div>

        <div>
            <label for="duration_minutes">Duration (minutes)</label>
            <input
                id="duration_minutes"
                name="duration_minutes"
                type="number"
                min="1"
            >
        </div>

        <div>
            <label for="base_price">Starting Price (₹)</label>
            <input
                id="base_price"
                name="base_price"
                type="number"
                min="0"
                step="0.01"
            >
        </div>

        <div>
            <label for="service_mode">Service Mode</label>
            <select id="service_mode" name="service_mode">
                <option value="HOME">Home</option>
                <option value="ONLINE">Online</option>
                <option value="CENTER">Center</option>
                <option value="HYBRID">Hybrid</option>
            </select>
        </div>

        <div>
            <label for="display_order">Display Order</label>
            <input
                id="display_order"
                name="display_order"
                type="number"
                min="0"
                value="0"
            >
        </div>

        <button type="submit">
            Create Service
        </button>

    </form>

    <p>
        <a href="{{ url_for('admin.services') }}">
            Cancel
        </a>
    </p>

</section>

{% endblock %}
